<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Chef Mate</title>
<link rel="icon" href="/assets/favicon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Chef Mate">
<meta property="og:title" content="Open Chef Mate">
<meta property="og:description" content="Opening your notifications in the Chef Mate app.">
<meta property="og:image" content="https://chefmate.plusmobileapps.com/assets/logo.png">
<meta name="twitter:card" content="summary">

<script>
  // iOS Smart App Banner: shows "OPEN" when Chef Mate is installed, "VIEW" (App Store) when not.
  // Built here so app-argument carries this URL into the app. Safari reads this while parsing
  // <head>, so it must be appended before <body>.
  (function () {
    var meta = document.createElement("meta");
    meta.name = "apple-itunes-app";
    meta.content = "app-id=6762543578, app-argument=" + window.location.href;
    document.head.appendChild(meta);
  })();
</script>

<style>
  :root {
    --brand: #2A52A4;
    --brand-dark: #1F3D7A;
    --text: #1f2129;
    --muted: #5d6270;
    --line: #e4e6ec;
    --bg-soft: #f6f7fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    line-height: 1.6;
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  a { color: var(--brand); }

  .card {
    max-width: 460px;
    width: 100%;
    text-align: center;
  }
  .mark { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.6rem; margin: 1.25rem 0 0.5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }

  .open-app {
    display: inline-block;
    background: var(--brand); color: #fff; text-decoration: none;
    padding: 0.7rem 1.5rem; border-radius: 8px; font-weight: 500;
  }
  .open-app:hover { background: var(--brand-dark); }

  .divider {
    margin: 2rem 0 1.25rem;
    border: 0; border-top: 1px solid var(--line);
  }
  .get { font-size: 0.9rem; color: var(--muted); margin: 0 0 0.85rem; }
  .stores {
    display: flex; align-items: center; justify-content: center;
    gap: 0.6rem; flex-wrap: wrap;
  }
  .stores img { height: 40px; width: auto; display: block; }
</style>
</head>
<body>

<div class="card">
  <img class="mark" src="/assets/logo.png" alt="Chef Mate">
  <h1>Opening Chef Mate…</h1>
  <p>If the app doesn’t open automatically, use the button below.</p>

  <a class="open-app" id="open-app" href="#">Open in app</a>

  <hr class="divider">

  <p class="get">Don’t have Chef Mate yet?</p>
  <div class="stores">
    <a href="https://apps.apple.com/app/chef-mate/id6762543578">
      <img src="/assets/app-store-badge.svg" alt="Download on the App Store">
    </a>
    <a href="https://play.google.com/store/apps/details?id=com.plusmobileapps.chefmate">
      <img src="/assets/google-play-badge.png" alt="Get it on Google Play">
    </a>
    <a href="https://apps.microsoft.com/detail/9nkbvzcq99wf">
      <img src="/assets/microsoft-store-badge.svg" alt="Get it from Microsoft">
    </a>
  </div>
  <p class="get" style="margin-top: 1.25rem;">
    Or <a href="/download">see all download options</a>.
  </p>
</div>

<script>
(function () {
  "use strict";

  // The custom scheme the desktop and mobile apps register. The invite email links to this page
  // (an https:// URL, which no desktop app can claim); the page hands the browser off to the scheme,
  // which the installed app *can* handle. See docs/navigation-deeplinks.md in the chef-mate repo.
  var SCHEME_URL = "chefmate://notifications";
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.plusmobileapps.chefmate";

  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  // On Android an intent:// URL opens the app if installed and falls back to the Play Store if not.
  var openUrl = SCHEME_URL;
  if (isAndroid) {
    openUrl = "intent://chefmate.plusmobileapps.com/notifications" +
      "#Intent;scheme=https;package=com.plusmobileapps.chefmate;S.browser_fallback_url=" +
      encodeURIComponent(PLAY_URL) + ";end";
  }

  document.getElementById("open-app").href = openUrl;

  // Auto-attempt the hand-off. On iOS a Universal Link normally opens the app before this page loads;
  // if we got here the app likely isn't installed, so we rely on the Smart App Banner instead of a
  // chefmate:// navigation (which surfaces an error when there is no handler). Everywhere else,
  // navigating to the scheme prompts the OS to open the app (and harmlessly no-ops if absent).
  if (!isIOS) {
    window.location.href = openUrl;
  }
})();
</script>

</body>
</html>
